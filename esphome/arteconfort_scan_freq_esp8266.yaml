# Frequency sweep to find which frequency your remote transmits on (ESP8266 / NodeMCU + CC1101).
#
# Use it when the capture firmware only sees noise (receptions of 2-5 pulses) even though you press the
# remote: the remote most likely does not transmit on the configured frequency.
#
#     esphome run arteconfort_scan_freq_esp8266.yaml
#
# Every 3 s it steps between 433.05 and 434.85 MHz (150 kHz steps; the filter is 250 kHz wide, so the
# steps overlap) and logs it:
#
#     --- Listening on 433.95 MHz (hold a key of the remote) ---
#     Received 0x3D41BAE4 (30 bits) = pattern 'neutrallight'      <-- that is the frequency!
#
#  * Hold the remote 1-2 cm from the module and keep a key pressed (or tap it repeatedly) for the whole
#    sweep (~40 s per lap).
#  * A real press is ~240 pulses. Lines "Not an ArteConfort frame (N pulses)" with N of 2-10 are noise;
#    a large N (> 50) at some frequency means there is a signal there. Held that close the signal leaks
#    into neighbouring steps, so take the frequency in the middle of the steps that decode.
#  * Put the frequency you found in `cc1101: frequency:` of the transmitter node and of the capture firmware.
#  * If nothing shows up in the whole band: check that the module is a 433 MHz one, that it has an antenna,
#    the wiring (above all GDO0 -> GPIO4) and the remote's battery.

substitutions:
  device_name: arteconfort-scan

esphome:
  name: ${device_name}
  on_boot:
    priority: -100          # after the CC1101 has finished its setup
    then:
      - cc1101.begin_rx: cc1101_radio

esp8266:
  board: nodemcuv2

external_components:
  - source:
      type: local
      path: components
    components: [arteconfort_433]

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

cc1101:
  id: cc1101_radio
  cs_pin: GPIO15
  frequency: 433.05MHz      # first frequency of the sweep
  modulation_type: ASK/OOK
  filter_bandwidth: 250kHz

remote_receiver:
  id: rf_rx
  pin: GPIO5                # GDO0
  tolerance: 25%
  filter: 200us             # ignore pulses shorter than 200 us (noise); real pulses are >= 300 us
  idle: 8ms
  dump: raw                 # dump the raw pulses (to analyze what the remote sends)

arteconfort_433:
  id: radio_rx
  receiver_id: rf_rx
  protocol: auto            # tries every known protocol (ArteConfort, Sulion) and tells you which one matched
  patterns: !include patterns/living_room.yaml

globals:
  - id: scan_idx
    type: int
    initial_value: '0'

interval:
  - interval: 3s
    then:
      - lambda: |-
          id(scan_idx) = (id(scan_idx) + 1) % 13;   // 13 steps: 433.05 ... 434.85 MHz
      - cc1101.set_frequency:
          id: cc1101_radio
          value: !lambda |-
            return 433.05e6f + 0.15e6f * id(scan_idx);
      - logger.log:
          format: "--- Listening on %.2f MHz (hold a key of the remote) ---"
          args: ['433.05f + 0.15f * id(scan_idx)']
